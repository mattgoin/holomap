<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holomap // 3D Planetary Stream Visualizer</title>
    <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; background: #000208; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        #map { width: 100vw; height: 100vh; }
        #overlay {
            position: absolute; top: 20px; left: 20px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); pointer-events: none;
            background: rgba(0, 5, 15, 0.85); padding: 14px 18px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-left: 4px solid #00ffcc;
            font-size: 13px; z-index: 10;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 0 6px 6px 0;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
        }
        .brand-title {
            font-weight: 800;
            letter-spacing: 2.5px;
            font-size: 15px;
            margin-bottom: 6px;
            color: #00ffcc;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-val { color: #fff; font-weight: bold; }

        /* Deck.gl Tooltip Overrides */
        .deck-tooltip {
            background: transparent !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            pointer-events: none !important;
        }

        /* Holomap Rich HUD Tooltip Card */
        .holomap-hud {
            background: rgba(6, 11, 22, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 255, 204, 0.15);
            display: flex;
            max-width: 360px;
            min-width: 280px;
            overflow: hidden;
            color: #e0e6ed;
            pointer-events: none;
        }

        .hud-poster {
            width: 82px;
            min-width: 82px;
            background: #03060c;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hud-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hud-content {
            flex: 1;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .hud-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .hud-user {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hud-status-badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .hud-status-badge.live {
            background: rgba(0, 255, 102, 0.15);
            color: #00ff66;
            border: 1px solid rgba(0, 255, 102, 0.5);
            animation: hud-pulse 2s infinite;
        }

        .hud-status-badge.paused {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
            border: 1px solid rgba(255, 170, 0, 0.5);
        }

        .hud-status-badge.recent {
            background: rgba(0, 204, 255, 0.15);
            color: #00ccff;
            border: 1px solid rgba(0, 204, 255, 0.4);
        }

        @keyframes hud-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .hud-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .hud-year {
            font-weight: 400;
            color: #8899aa;
            font-size: 11px;
            margin-left: 4px;
        }

        .hud-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 2px;
        }

        .badge {
            font-size: 9.5px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-stream.direct {
            background: rgba(0, 204, 120, 0.15);
            color: #00ff88;
            border: 1px solid rgba(0, 204, 120, 0.4);
        }

        .badge-stream.transcode {
            background: rgba(255, 153, 0, 0.15);
            color: #ffaa00;
            border: 1px solid rgba(255, 153, 0, 0.4);
        }

        .badge-tech {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .badge-bitrate {
            background: rgba(0, 204, 255, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(0, 204, 255, 0.3);
        }

        .hud-progress-wrap {
            margin-top: 4px;
        }

        .hud-progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .hud-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #00ff66);
            border-radius: 2px;
            box-shadow: 0 0 6px #00ffcc;
        }

        .hud-progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 9.5px;
            color: #94a3b8;
            margin-top: 3px;
            font-variant-numeric: tabular-nums;
        }

        .hud-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 5px;
            margin-top: 2px;
            font-size: 10px;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="overlay">
        <div class="brand-title">
            <span>🛰️ HOLOMAP // PLEX STREAM RECON</span>
        </div>
        <div id="stats">Establishing link with Plex...</div>
    </div>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTime(ms) {
            if (!ms || isNaN(ms)) return '0:00';
            const totalSecs = Math.floor(ms / 1000);
            const hrs = Math.floor(totalSecs / 3600);
            const mins = Math.floor((totalSecs % 3600) / 60);
            const secs = totalSecs % 60;
            if (hrs > 0) {
                return `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        window.onload = function() {
            const { DeckGL, ArcLayer, ScatterplotLayer, GeoJsonLayer, _GlobeView } = deck;

            let SERVER_LOCATION = [0, 0];
            let SERVER_NAME = 'Base Station';
            const COLOR_SEED = Math.random() * 1000000;
            let data = { points: [] };
            let timer = 0;

            function getColor(userString) {
                if (!userString) return [255, 255, 255];
                let hash = COLOR_SEED;
                for (let i = 0; i < userString.length; i++) {
                    hash = userString.charCodeAt(i) + ((hash << 5) - hash);
                }
                const r = (hash & 0xFF0000) >> 16;
                const g = (hash & 0x00FF00) >> 8;
                const b = (hash & 0x0000FF);
                return [Math.abs(r) % 135 + 120, Math.abs(g) % 255, Math.abs(b) % 255];
            }

            class CometArcLayer extends ArcLayer {
                getShaders() {
                    const shaders = super.getShaders();
                    shaders.inject = {
                        'vs:#decl': `varying float v_progress;`,
                        'vs:#main-end': `v_progress = geometry.uv.x;`,
                        'fs:#decl': `
                            varying float v_progress;
                            uniform float currentTime;
                            uniform float tailLength;
                        `,
                        'fs:#main-start': `
                            float speed = 0.15;
                            float t = fract(currentTime * speed);
                            float dist = fract(t - v_progress);
                            if (dist > tailLength) discard;
                            float alpha = smoothstep(0.0, tailLength, tailLength - dist);
                            alpha = pow(alpha, 2.0);
                            gl_FragColor.a *= alpha;
                        `
                    };
                    return shaders;
                }
                draw(opts) {
                    opts.uniforms = {
                        ...opts.uniforms,
                        currentTime: this.props.currentTime,
                        tailLength: 0.4
                    };
                    super.draw(opts);
                }
            }
            CometArcLayer.layerName = 'CometArcLayer';
            CometArcLayer.defaultProps = { ...ArcLayer.defaultProps, currentTime: {type: 'number', value: 0} };

            const deckgl = new DeckGL({
                container: 'map',
                views: new _GlobeView({ id: 'globe', controller: true, resolution: 10 }),
                initialViewState: { longitude: -95, latitude: 38, zoom: 1.5, pitch: 45, bearing: -10 },
                parameters: {
                    depthTest: true, cull: true,
                    clearColor: [0, 2/255, 8/255, 1],
                    blendFunc: [770, 1, 1, 1],
                    blendEquation: 0x8006
                },
                getTooltip: ({object}) => {
                    if (!object) return null;
                    if (object.isServer) {
                        return {
                            html: `
                            <div class="holomap-hud" style="border-left: 3px solid #00ffcc; padding: 12px 16px; flex-direction: column; gap: 4px;">
                                <div class="hud-header">
                                    <span class="hud-status-badge live" style="background: rgba(0,255,204,0.15); color: #00ffcc; border-color: #00ffcc;">● BASE STATION</span>
                                </div>
                                <div class="hud-title" style="font-size: 14px; color: #fff;">${escapeHtml(SERVER_NAME)}</div>
                                <div style="font-size: 11px; color: #8899aa;">Central Plex Host Origin Node</div>
                            </div>`,
                            style: { backgroundColor: 'transparent' }
                        };
                    }
                    if (!object.user) return null;

                    const rgb = getColor(object.user);
                    const userColor = `rgb(${rgb.join(',')})`;
                    const loc = [object.city, object.region, object.country].filter(Boolean).join(', ') || 'Unknown Location';
                    const clientStr = [object.platform, object.device].filter(Boolean).join(' • ') || object.device || 'Plex Client';

                    // Playback status badge
                    let statusClass = 'recent';
                    let statusText = '○ 24H RECENT';
                    if (object.active) {
                        if (object.state === 'paused') {
                            statusClass = 'paused';
                            statusText = '⏸ PAUSED';
                        } else {
                            statusClass = 'live';
                            statusText = '● PLAYING';
                        }
                    }

                    // Transcode vs Direct Play badge
                    let transcodeBadge = '';
                    if (object.isTranscode) {
                        transcodeBadge = `<span class="badge badge-stream transcode">⚙️ TRANSCODE ${object.isHw ? '(HW)' : ''}</span>`;
                    } else {
                        transcodeBadge = `<span class="badge badge-stream direct">⚡ DIRECT PLAY</span>`;
                    }

                    // Quality & Codec badges
                    const resBadge = object.videoResolution ? `<span class="badge badge-tech">${escapeHtml(object.videoResolution)}</span>` : '';
                    const codecBadge = object.videoCodec ? `<span class="badge badge-tech">${escapeHtml(object.videoCodec)}${object.audioCodec ? ' / ' + escapeHtml(object.audioCodec) : ''}</span>` : '';
                    const bitrateBadge = object.bitrate ? `<span class="badge badge-bitrate">${escapeHtml(object.bitrate)}</span>` : '';

                    // Progress bar
                    let progressHtml = '';
                    if (object.active && object.duration > 0) {
                        const percent = Math.min(100, Math.max(0, object.progressPercent || 0));
                        progressHtml = `
                        <div class="hud-progress-wrap">
                            <div class="hud-progress-track">
                                <div class="hud-progress-fill" style="width: ${percent}%;"></div>
                            </div>
                            <div class="hud-progress-meta">
                                <span>${formatTime(object.viewOffset)} / ${formatTime(object.duration)}</span>
                                <span>${percent}%</span>
                            </div>
                        </div>`;
                    }

                    // Poster artwork
                    let posterHtml = '';
                    if (object.thumb) {
                        posterHtml = `
                        <div class="hud-poster">
                            <img src="/api/poster?thumb=${encodeURIComponent(object.thumb)}" alt="Poster" onerror="this.parentElement.style.display='none'"/>
                        </div>`;
                    }

                    return {
                        html: `
                        <div class="holomap-hud" style="border-color: ${userColor};">
                            ${posterHtml}
                            <div class="hud-content">
                                <div class="hud-header">
                                    <span class="hud-user">
                                        <span style="color: ${userColor}; font-size: 13px;">●</span> ${escapeHtml(object.user)}
                                    </span>
                                    <span class="hud-status-badge ${statusClass}">${statusText}</span>
                                </div>
                                <div class="hud-title">
                                    ${escapeHtml(object.title || 'Unknown Media')}
                                    ${object.year ? `<span class="hud-year">(${escapeHtml(object.year)})</span>` : ''}
                                </div>
                                <div class="hud-badges">
                                    ${transcodeBadge}
                                    ${resBadge}
                                    ${codecBadge}
                                    ${bitrateBadge}
                                </div>
                                ${progressHtml}
                                <div class="hud-footer">
                                    <span>🖥️ ${escapeHtml(clientStr)}</span>
                                    <span>📍 ${escapeHtml(loc)}</span>
                                </div>
                            </div>
                        </div>`,
                        style: { backgroundColor: 'transparent' }
                    };
                }
            });

            async function fetchData() {
                try {
                    const response = await fetch('/api/map-data');
                    const rawData = await response.json();
                    data.points = rawData.points || [];
                    if (rawData.userLocation && rawData.userLocation.length === 2) {
                        SERVER_LOCATION = rawData.userLocation;
                    }
                    if (rawData.homeName) {
                        SERVER_NAME = rawData.homeName;
                    }
                    const activeCount = data.points.filter(p => p.active).length;
                    const totalCount = data.points.length;
                    document.getElementById('stats').innerHTML = `
                        <span style="color:#00ff66">●</span> LIVE STREAMS: <span class="stats-val">${activeCount}</span> &nbsp;|&nbsp;
                        <span style="color:#00ccff">○</span> RECENT (24H): <span class="stats-val">${totalCount}</span>
                    `;
                    renderLayers();
                } catch (e) {
                    console.error('[Holomap] Fetch error:', e);
                    document.getElementById('stats').innerHTML = `<span style="color:#ff3333">CONNECTION_INTERRUPTED</span>`;
                }
            }

            function renderLayers() {
                const boundaries = new GeoJsonLayer({
                    id: 'boundaries',
                    data: 'https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson',
                    filled: true,
                    getFillColor: [0, 20, 50, 200],
                    stroked: true,
                    getLineColor: [0, 100, 200, 255],
                    getLineWidth: 1,
                    lineWidthMinPixels: 1,
                    opacity: 0.8
                });

                const states = new GeoJsonLayer({
                    id: 'states',
                    data: 'https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json',
                    filled: false,
                    stroked: true,
                    getLineColor: [0, 60, 120, 150],
                    getLineWidth: 1,
                    lineWidthMinPixels: 0.5,
                    opacity: 0.5
                });

                const arcLayer = new CometArcLayer({
                    id: 'comet-arcs',
                    data: data.points,
                    getSourcePosition: d => d.coords || [0,0],
                    getTargetPosition: d => SERVER_LOCATION,
                    getSourceColor: d => [...getColor(d.user), 255],
                    getTargetColor: d => [...getColor(d.user), 0],
                    getStrokeWidth: 4,
                    getHeight: 0.4,
                    currentTime: timer,
                    pickable: true,
                    updateTriggers: { currentTime: [timer] }
                });

                const pointCores = new ScatterplotLayer({
                    id: 'point-cores',
                    data: data.points.filter(p => p.active),
                    getPosition: d => d.coords,
                    getRadius: 30000,
                    getFillColor: d => [...getColor(d.user), 255],
                    pickable: true
                });

                const historicalPoints = new ScatterplotLayer({
                    id: 'historical-points',
                    data: data.points.filter(p => !p.active),
                    getPosition: d => d.coords,
                    getRadius: 25000,
                    getFillColor: d => [...getColor(d.user), 90],
                    pickable: true
                });

                const activePoints = data.points.filter(p => p.active);
                const scatterLayers = [0, 1, 2].map(i => new ScatterplotLayer({
                    id: `pings-${i}`,
                    data: activePoints,
                    getPosition: d => d.coords,
                    getRadius: d => 30000 + ((timer * 15 + i * 20) % 60) * 1000,
                    getFillColor: d => {
                        const rgb = getColor(d.user);
                        const progress = (timer * 15 + i * 20) % 60;
                        const opacity = Math.max(0, 150 * (1 - (progress / 60)));
                        return [...rgb, opacity];
                    },
                    updateTriggers: { getRadius: [timer], getFillColor: [timer] }
                }));

                const serverLayer = new ScatterplotLayer({
                    id: 'server',
                    data: [{ position: SERVER_LOCATION, isServer: true }],
                    getPosition: d => d.position,
                    getRadius: 35000,
                    getFillColor: [0, 255, 204, 255],
                    stroked: true,
                    lineWidthMinPixels: 2,
                    getLineColor: [0, 255, 204, 255],
                    pickable: true
                });

                deckgl.setProps({
                    layers: [boundaries, states, arcLayer, pointCores, historicalPoints, ...scatterLayers, serverLayer]
                });
            }

            function animate() {
                timer += 0.5;
                renderLayers();
                requestAnimationFrame(animate);
            }

            // Fast 10-second polling for real-time reactivity
            setInterval(fetchData, 10000);
            fetchData();
            animate();
        };
    </script>
</body>
</html>
